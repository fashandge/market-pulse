<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Most-Shorted Basket Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: control rail left, chart stack right; stacks to one column on phones. Solarized Light, like the rest of market-pulse. */
:root{
  --bg:#fdf6e3; --panel:#eee8d5; --surface:#fffdf6; --line:#93a1a1; --grid:#eee8d5; --ref:#93a1a1;
  --ink:#073642; --ink-soft:#586e75; --muted:#657b83; --on-strong:#fdf6e3; --strong:#586e75;
  --accent:#268bd2;
  --font-ui:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  --font-data:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-soft);font:15px/1.45 var(--font-ui)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border-radius:10px;padding:14px 16px;align-self:start}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);text-wrap:balance}
.sub{font-size:13px;color:var(--muted);margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--c);background:transparent;color:var(--ink-soft);border-radius:999px;
  padding:3px 11px;font:inherit;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c);color:#fdf6e3}
.chip.on .dot{background:#fdf6e3}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);font:inherit;
  font-size:13.5px;padding:3px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
input[type=number],input[type=date]{font:inherit;font-size:13.5px;background:var(--bg);color:var(--ink-soft);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}
input[type=number]{width:64px;font-family:var(--font-data)}
label.tog{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:6px;cursor:pointer}
.presets{flex-direction:column}
.presets button{text-align:left}
.dim{opacity:.45;pointer-events:none}
main{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--panel);border-radius:10px;padding:10px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;min-height:22px;color:var(--ink-soft)}
.legend .it{display:flex;gap:6px;align-items:center}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend .sw{width:16px;height:3px;border-radius:2px}
.legend .v{font-family:var(--font-data);color:var(--ink);font-variant-numeric:tabular-nums}
canvas{width:100%;display:block;touch-action:pan-y}
.stats{font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.prompt{font-size:14px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.copy{float:right;margin:0 0 6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font:inherit;
  font-size:13px;padding:3px 10px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Most-shorted basket overlay</h1>
  <div class="sub">Equal-weight top-50 short-interest basket (FINRA, monthly rebalance) vs ETFs. All lines rebased to 100 at the first visible session.</div>

  <h2>Presets</h2>
  <div class="seg presets" id="presets"></div>

  <h2>Series</h2>
  <div class="chips" id="chips"></div>
  <label class="tog"><input type="checkbox" id="ratio"> Lower pane: basket ÷ QQQ (relative strength)</label>

  <h2>Smoothing</h2>
  <div class="seg" id="smooth"></div>
  <div class="row" id="nrow">
    <span>N</span><input type="range" id="nRange" min="2" max="250" step="1">
    <input type="number" id="nNum" min="2" max="500">
  </div>
  <label class="tog" id="rawrow"><input type="checkbox" id="showRaw"> Keep raw lines faintly behind</label>

  <h2>Range</h2>
  <div class="seg" id="range"></div>
  <div class="row"><span>From</span><input type="date" id="from"></div>

  <h2>Scale</h2>
  <div class="seg" id="scale"></div>
</aside>

<main>
  <div class="card">
    <div class="legend" id="legend"></div>
    <canvas id="cv"></canvas>
  </div>
  <div class="card stats" id="stats"></div>
  <div class="card">
    <button class="copy" id="copy">Copy prompt</button>
    <div class="prompt" id="prompt"></div>
  </div>
</main>
</div>

<script>
const DATA = __DATA__;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const D = DATA.dates, S = DATA.series;
const META = {
  BASKET:{label:'Most-shorted', color:'#dc322f', width:2.6},
  QQQ:{label:'QQQ', color:'#268bd2', width:2},
  SPY:{label:'SPY', color:'#859900', width:2},
  SMH:{label:'SMH', color:'#2aa198', width:2},
  SOXX:{label:'SOXX', color:'#6c71c4', width:2},
};
const KEYS = Object.keys(META);
const RANGES = {'3M':0.25,'6M':0.5,'1Y':1,'2Y':2,'3Y':3,'Max':null};

const DEFAULTS = {visible:{BASKET:true,QQQ:true,SPY:false,SMH:false,SOXX:false},
  smooth:'none', n:20, showRaw:true, range:'3Y', from:null, scale:'linear', ratio:false};
const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULTS);

const PRESETS = {
  'Default — raw, QQQ only': {},
  'Swing — 10 EMA, 1Y': {smooth:'ema', n:10, range:'1Y'},
  'Trend — 50 SMA, 3Y, ratio': {smooth:'sma', n:50, range:'3Y', ratio:true},
  'Semis vs shorts — 20 EMA, 2Y': {visible:{BASKET:true,QQQ:false,SPY:false,SMH:true,SOXX:true}, smooth:'ema', n:20, range:'2Y'},
  'Full history — log, 100 SMA': {visible:{BASKET:true,QQQ:true,SPY:true,SMH:true,SOXX:true}, smooth:'sma', n:100, range:'Max', scale:'log', showRaw:false},
};

// ---------- math ----------
function sma(a, n){
  const out = new Array(a.length).fill(null); let sum = 0, cnt = 0, q = [];
  for (let i = 0; i < a.length; i++){
    const v = a[i];
    if (v == null){ continue; }
    q.push(v); sum += v;
    if (q.length > n) sum -= q.shift();
    if (q.length === n) out[i] = sum / n;
  }
  return out;
}
function ema(a, n){
  const out = new Array(a.length).fill(null), k = 2 / (n + 1);
  let seed = [], e = null;
  for (let i = 0; i < a.length; i++){
    const v = a[i]; if (v == null) continue;
    if (e == null){ seed.push(v); if (seed.length === n){ e = seed.reduce((x,y)=>x+y,0)/n; out[i] = e; } continue; }
    e = v * k + e * (1 - k); out[i] = e;
  }
  return out;
}
const smoothFn = a => state.smooth === 'sma' ? sma(a, state.n) : state.smooth === 'ema' ? ema(a, state.n) : a;
const ratioRaw = S.BASKET.map((b,i) => b != null && S.QQQ[i] != null ? b / S.QQQ[i] : null);

function startIndex(){
  let from = state.from;
  if (!from){
    const yrs = RANGES[state.range];
    if (yrs == null) return 0;
    const d = new Date(D[D.length-1]); d.setDate(d.getDate() - Math.round(yrs*365.25));
    from = d.toISOString().slice(0,10);
  }
  const i = D.findIndex(x => x >= from);
  return i < 0 ? 0 : i;
}
function compute(){
  const i0 = startIndex(), smoothed = state.smooth !== 'none';
  const lines = [];
  for (const k of KEYS){
    if (!state.visible[k]) continue;
    // Rebase raw and smoothed off the same raw base so they share a level.
    const raw = S[k], sm = smoothFn(raw);
    const base = raw.slice(i0).find(v => v != null);
    const rb = a => a.map((v,i) => i < i0 || v == null ? null : v / base * 100);
    if (smoothed && state.showRaw) lines.push({k, ys: rb(raw), faint:true});
    lines.push({k, ys: rb(sm)});
  }
  let ratio = null;
  if (state.ratio){
    const sm = smoothFn(ratioRaw), base = ratioRaw.slice(i0).find(v => v != null);
    const rb = a => a.map((v,i) => i < i0 || v == null ? null : v / base * 100);
    ratio = {raw: rb(ratioRaw), sm: rb(sm)};
  }
  return {i0, lines, ratio};
}

// ---------- chart ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let layout = null, hoverIdx = null;
function niceTicks(lo, hi, count){
  const span = hi - lo, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= step0);
  const out = []; for (let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
function drawPane(p, series, i0, n, title){
  const {x, y, w, h} = p;
  let lo = Infinity, hi = -Infinity;
  for (const s of series) for (let i = i0; i < n; i++){ const v = s.ys[i]; if (v != null){ lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (!isFinite(lo)){ lo = 90; hi = 110; }
  const log = state.scale === 'log';
  const f = v => log ? Math.log(v) : v;
  let flo = f(lo), fhi = f(hi), pad = (fhi - flo) * 0.06 || 1; flo -= pad; fhi += pad;
  const X = i => x + (i - i0) / Math.max(1, n - 1 - i0) * w;
  const Y = v => y + h - (f(v) - flo) / (fhi - flo) * h;
  p.X = X; p.Y = Y; p.lo = flo; p.hi = fhi;
  // grid + y labels
  ctx.font = '12px ui-monospace,Menlo,monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tlo = log ? Math.exp(flo) : flo, thi = log ? Math.exp(fhi) : fhi;
  for (const t of niceTicks(tlo, thi, log ? 6 : 6)){
    if (t <= 0 && log) continue;
    const yy = Y(t); if (yy < y - 1 || yy > y + h + 1) continue;
    ctx.strokeStyle = t === 100 ? css('--ref') : css('--grid'); ctx.lineWidth = t === 100 ? 1.2 : 1;
    ctx.setLineDash(t === 100 ? [4,4] : []);
    ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = css('--muted'); ctx.fillText(String(+t.toFixed(1)), x + w + 6, yy);
  }
  if (title){ ctx.fillStyle = css('--ink-soft'); ctx.font = '13px "Atkinson Hyperlegible",sans-serif'; ctx.textBaseline='top'; ctx.fillText(title, x + 4, y + 2); }
  // lines
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (const s of series){
    ctx.strokeStyle = s.color; ctx.globalAlpha = s.faint ? 0.22 : 1; ctx.lineWidth = s.faint ? 1.2 : s.width;
    ctx.lineJoin = 'round'; ctx.beginPath(); let pen = false;
    for (let i = i0; i < n; i++){
      const v = s.ys[i]; if (v == null || (log && v <= 0)){ pen = false; continue; }
      const px = X(i), py = Y(v); pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py); pen = true;
    }
    ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function xTicks(p, i0, n){
  const spanDays = (new Date(D[n-1]) - new Date(D[i0])) / 864e5;
  const monthly = spanDays < 800, stepM = spanDays < 250 ? 1 : spanDays < 800 ? 3 : 12;
  ctx.font = '12px "Atkinson Hyperlegible",sans-serif'; ctx.fillStyle = css('--muted'); ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let last = null;
  for (let i = i0; i < n; i++){
    const ym = D[i].slice(0,7), m = +D[i].slice(5,7);
    if (ym === last) continue; last = ym;
    if (i === i0) continue;
    if (monthly ? (m - 1) % stepM !== 0 : m !== 1) continue;
    const xx = p.X(i);
    ctx.strokeStyle = css('--grid'); ctx.beginPath(); ctx.moveTo(xx, p.y); ctx.lineTo(xx, p.bottom); ctx.stroke();
    ctx.fillText(monthly ? D[i].slice(0,7) : D[i].slice(0,4), xx, p.bottom + 6);
  }
}
function render(){
  const {i0, lines, ratio} = compute(), n = D.length;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = ratio ? 600 : 480;
  cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const left = 4, right = 46, w = W - left - right;
  const mainH = ratio ? H - 190 : H - 28;
  const main = {x:left, y:6, w, h:mainH};
  drawPane(main, lines.map(l => ({...META[l.k], ys:l.ys, faint:l.faint})), i0, n);
  let panes = [main];
  if (ratio){
    const rp = {x:left, y:mainH + 22, w, h:140};
    const rs = [];
    if (state.smooth !== 'none' && state.showRaw) rs.push({color:'#b58900', width:1.2, ys:ratio.raw, faint:true});
    rs.push({color:'#b58900', width:2, ys:ratio.sm});
    drawPane(rp, rs, i0, n, 'Basket ÷ QQQ (rising = shorts beating QQQ)');
    panes.push(rp);
  }
  const last = panes[panes.length-1];
  const all = {X:main.X, y:main.y, bottom:last.y + last.h};
  xTicks(all, i0, n);
  layout = {i0, n, lines, ratio, main, panes, all};
  if (hoverIdx != null) drawHover();
  renderLegend(hoverIdx ?? n - 1);
  renderStats();
}
function drawHover(){
  const {main, all, lines} = layout, i = hoverIdx, xx = main.X(i);
  ctx.strokeStyle = css('--ink-soft'); ctx.lineWidth = 1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(xx, all.y); ctx.lineTo(xx, all.bottom); ctx.stroke(); ctx.setLineDash([]);
  for (const l of lines){ if (l.faint) continue; const v = l.ys[i]; if (v == null) continue;
    ctx.fillStyle = META[l.k].color; ctx.beginPath(); ctx.arc(xx, main.Y(v), 3.5, 0, 7); ctx.fill(); }
}
function fmt(v){ return v == null ? '—' : v.toFixed(1); }
function renderLegend(i){
  const el = document.getElementById('legend'), {lines, ratio} = layout;
  const tag = state.smooth === 'none' ? '' : ` ${state.smooth.toUpperCase()}${state.n}`;
  let h = `<span class="it"><b>${D[i]}</b></span>`;
  for (const l of lines){ if (l.faint) continue;
    h += `<span class="it"><span class="sw" style="background:${META[l.k].color}"></span>${META[l.k].label}${tag} <span class="v">${fmt(l.ys[i])}</span></span>`; }
  if (ratio) h += `<span class="it"><span class="sw" style="background:#b58900"></span>Basket÷QQQ${tag} <span class="v">${fmt(ratio.sm[i])}</span></span>`;
  el.innerHTML = h;
}
function renderStats(){
  const {i0, n} = layout, parts = [];
  for (const k of KEYS){ if (!state.visible[k]) continue;
    const a = S[k], b = a.slice(i0).find(v => v != null), e = a[n-1];
    if (b == null || e == null) continue;
    const r = (e / b - 1) * 100;
    parts.push(`${META[k].label} <b>${r >= 0 ? '+' : ''}${r.toFixed(1)}%</b>`);
  }
  document.getElementById('stats').innerHTML =
    `Raw return ${D[i0]} → ${D[n-1]}: ` + parts.join(' · ') +
    `<br>Basket is equal-weight, rebalanced monthly from FINRA short interest; it tracks the turning points of Goldman's GSCBMSAL, not its level.`;
}
cv.addEventListener('mousemove', e => {
  if (!layout) return;
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, {i0, n, main} = layout;
  const i = Math.round(i0 + (mx - main.x) / main.w * (n - 1 - i0));
  hoverIdx = Math.max(i0, Math.min(n - 1, i));
  render();
});
cv.addEventListener('mouseleave', () => { hoverIdx = null; render(); });
window.addEventListener('resize', render);
cv.addEventListener('touchmove', e => { const t = e.touches[0]; cv.dispatchEvent(new MouseEvent('mousemove', {clientX:t.clientX, clientY:t.clientY})); }, {passive:true});

// ---------- controls ----------
function seg(id, opts, key, labels){
  const el = document.getElementById(id); el.innerHTML = '';
  for (const o of opts){ const b = document.createElement('button'); b.textContent = labels ? labels[o] : o; b.dataset.v = o;
    b.onclick = () => { state[key] = o; if (key === 'range') state.from = null; updateAll(); }; el.appendChild(b); }
}
seg('smooth', ['none','sma','ema'], 'smooth', {none:'None', sma:'SMA', ema:'EMA'});
seg('range', Object.keys(RANGES), 'range');
seg('scale', ['linear','log'], 'scale', {linear:'Linear', log:'Log'});
const chips = document.getElementById('chips');
for (const k of KEYS){ const b = document.createElement('button'); b.className = 'chip'; b.style.setProperty('--c', META[k].color);
  b.innerHTML = `<span class="dot"></span>${META[k].label}`; b.dataset.k = k;
  b.onclick = () => { state.visible[k] = !state.visible[k]; updateAll(); }; chips.appendChild(b); }
const pr = document.getElementById('presets');
for (const [name, p] of Object.entries(PRESETS)){ const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { state = Object.assign(clone(DEFAULTS), clone(p)); updateAll(); }; pr.appendChild(b); }
const nRange = document.getElementById('nRange'), nNum = document.getElementById('nNum');
const setN = v => { v = Math.max(2, Math.min(500, Math.round(+v || 2))); state.n = v; updateAll(); };
nRange.oninput = e => setN(e.target.value);
nNum.onchange = e => setN(e.target.value);
document.getElementById('showRaw').onchange = e => { state.showRaw = e.target.checked; updateAll(); };
document.getElementById('ratio').onchange = e => { state.ratio = e.target.checked; updateAll(); };
const fromEl = document.getElementById('from');
fromEl.min = D[0]; fromEl.max = D[D.length-1];
fromEl.onchange = e => { state.from = e.target.value || null; updateAll(); };

function syncControls(){
  for (const [id, key] of [['smooth','smooth'],['range','range'],['scale','scale']])
    for (const b of document.getElementById(id).children)
      b.classList.toggle('on', b.dataset.v === state[key] && !(key === 'range' && state.from));
  for (const b of chips.children) b.classList.toggle('on', !!state.visible[b.dataset.k]);
  nRange.value = Math.min(250, state.n); nNum.value = state.n;
  const sm = state.smooth !== 'none';
  document.getElementById('nrow').classList.toggle('dim', !sm);
  document.getElementById('rawrow').classList.toggle('dim', !sm);
  document.getElementById('showRaw').checked = state.showRaw;
  document.getElementById('ratio').checked = state.ratio;
  fromEl.value = D[startIndex()];
}

function updatePrompt(){
  const vis = KEYS.filter(k => state.visible[k]).map(k => META[k].label);
  const parts = [];
  parts.push(`Chart the most-shorted basket (most_shorted_basket_daily.value in data/stocks/stocks.duckdb)` +
    (vis.filter(v => v !== 'Most-shorted').length ? ` overlaid with ${vis.filter(v => v !== 'Most-shorted').join(', ')} (daily_bars_adjusted.close_adjusted)` : '') +
    `, every line rebased to 100 at the first session shown`);
  if (!state.visible.BASKET) parts.push('hide the basket line itself');
  if (state.from) parts.push(`start the window on ${D[startIndex()]}`);
  else if (state.range !== DEFAULTS.range) parts.push(state.range === 'Max' ? 'use the full history from 2018-01-10' : `show the trailing ${state.range}`);
  else parts.push('show the trailing 3 years');
  if (state.smooth !== 'none'){
    const nm = state.smooth === 'ema' ? 'exponential' : 'simple';
    const feel = state.n <= 10 ? 'light, swing-level' : state.n <= 30 ? 'moderate' : state.n <= 80 ? 'heavy, trend-level' : 'very heavy, cycle-level';
    parts.push(`smooth each line with a ${state.n}-day ${nm} moving average (${state.smooth.toUpperCase()}${state.n}, ${feel} smoothing) computed over the full history before rebasing` +
      (state.showRaw ? ', with the raw lines drawn faintly behind' : ', hiding the raw lines'));
  }
  if (state.scale === 'log') parts.push('use a log y-axis');
  if (state.ratio) parts.push('add a lower pane plotting basket ÷ QQQ as relative strength (rising means the most-shorted names are beating QQQ' +
    (state.smooth !== 'none' ? ', smoothed the same way' : '') + ')');
  document.getElementById('prompt').textContent = parts[0] + '; ' + parts.slice(1).join('; ') + '.';
}
function updateAll(){ syncControls(); render(); updatePrompt(); }
document.getElementById('copy').onclick = async e => {
  try { await navigator.clipboard.writeText(document.getElementById('prompt').textContent); e.target.textContent = 'Copied!'; }
  catch { e.target.textContent = 'Copy failed'; }
  setTimeout(() => e.target.textContent = 'Copy prompt', 1200);
};
updateAll();
</script>
</body>
</html>
